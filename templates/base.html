<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Rt Scholarship Platform{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
            colors: { ink: '#172033', mist: '#f6f8fb', ocean: '#2563eb' },
            boxShadow: {
              soft: '0 18px 50px rgba(23, 32, 51, 0.07)',
              lift: '0 24px 60px rgba(23, 32, 51, 0.11)'
            }
          }
        }
      }
    </script>
    <style>
      body { background: #f6f8fb; color: #172033; }
      .mesh { background: radial-gradient(circle at 8% 0%, rgba(147, 197, 253, .26), transparent 32%), radial-gradient(circle at 96% 12%, rgba(226, 232, 240, .8), transparent 30%); }
      .glass { background: rgba(255, 255, 255, .72); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
      .eyebrow { letter-spacing: .16em; }
    </style>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <div class="mesh min-h-screen">
      <header class="mx-auto flex max-w-7xl items-center justify-between px-6 py-6 lg:px-10">
        <a href="/" class="flex items-center gap-3" aria-label="Rt 장학사업 홈">
          <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-ink text-sm font-bold text-white shadow-soft">Rt</span>
          <span>
            <span class="block text-sm font-semibold tracking-tight text-ink">Remnant Trust</span>
            <span class="block text-xs text-slate-500">기금 관리</span>
          </span>
        </a>
        <nav class="glass flex flex-wrap items-center gap-1 rounded-full border border-white/80 p-1 shadow-sm sm:flex" aria-label="주요 메뉴">
          {% if finance_access %}
          <a href="/finance" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 hover:bg-white">입출금 관리</a>
          {% endif %}
          {% if not finance_access %}
          <a href="/announcements" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 hover:bg-white">공고 보기</a>
          {% endif %}
        </nav>
        <span class="hidden rounded-full border border-slate-200/80 bg-white/60 px-4 py-2 text-xs font-medium text-slate-500 sm:inline-flex">{{ user.name if user else 'Rt community' }}</span>
      </header>
      <main class="mx-auto max-w-7xl px-6 pb-16 lg:px-10">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
