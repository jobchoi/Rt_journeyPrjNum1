{% extends "base.html" %}
{% block title %}회원가입 · Rt{% endblock %}
{% block content %}
<section class="flex min-h-[calc(100vh-120px)] items-center justify-center py-10">
  <div class="w-full max-w-lg rounded-3xl border border-white/80 bg-white/75 p-8 shadow-lift backdrop-blur-xl sm:p-12">
    <a href="/login" class="text-xs font-semibold text-blue-600 hover:text-blue-800">← 로그인으로 돌아가기</a>
    <h1 class="mt-8 text-3xl font-semibold tracking-tight">함께 시작해요.</h1>
    <p class="mt-3 text-sm leading-6 text-slate-500">Rt 장학 플랫폼 계정을 만들어 공고를 확인하세요.</p>
    <form id="register-form" class="mt-8 space-y-5">
      <label class="block text-sm font-medium text-slate-700">이름<input name="name" autocomplete="name" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100" /></label>
      <label class="block text-sm font-medium text-slate-700">이메일<input name="email" type="email" autocomplete="email" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100" /></label>
      <label class="block text-sm font-medium text-slate-700">비밀번호<input name="password" type="password" minlength="8" autocomplete="new-password" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100" /></label>
      <p class="rounded-2xl bg-slate-50 px-4 py-3 text-xs leading-5 text-slate-500">일반 가입 계정은 신청자 권한으로 생성됩니다.</p>
      <p id="form-error" class="hidden rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
      <button id="submit-button" type="submit" class="w-full rounded-2xl bg-ink px-5 py-3.5 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800 hover:shadow-md">계정 만들기</button>
    </form>
  </div>
</section>
<script>
  const form = document.getElementById('register-form');
  const errorBox = document.getElementById('form-error');
  const submitButton = document.getElementById('submit-button');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.add('hidden');
    submitButton.disabled = true;
    submitButton.textContent = '생성 중...';
    try {
      const response = await fetch('/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.detail || '회원가입에 실패했습니다.');
      window.location.href = '/login';
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.remove('hidden');
      submitButton.disabled = false;
      submitButton.textContent = '계정 만들기';
    }
  });
</script>
{% endblock %}
