{% extends "base.html" %}
{% block title %}로그인 · Rt{% endblock %}
{% block content %}
<section class="flex min-h-[calc(100vh-120px)] items-center justify-center py-10">
  <div class="grid w-full max-w-5xl overflow-hidden rounded-3xl border border-white/80 bg-white/70 shadow-lift backdrop-blur-xl lg:grid-cols-[.85fr_1.15fr]">
    <div class="hidden bg-ink p-12 text-white lg:flex lg:flex-col lg:justify-between">
      <div><p class="eyebrow text-xs font-semibold uppercase text-blue-200">Remnant Trust</p><h1 class="mt-16 text-5xl font-semibold leading-tight tracking-[-0.05em]">당신의 다음<br /><span class="text-blue-300">여정을 위해.</span></h1></div>
      <p class="max-w-xs text-sm leading-6 text-slate-300">입출금 내역과 거래 보고서를 한곳에서 관리하세요.</p>
    </div>
    <div class="p-8 sm:p-12">
      <div class="mx-auto max-w-md">
        <a href="/register" class="text-xs font-semibold text-blue-600 hover:text-blue-800">새 계정 만들기 →</a>
        <h2 class="mt-8 text-3xl font-semibold tracking-tight">다시 만나서 반가워요.</h2>
        <p class="mt-3 text-sm leading-6 text-slate-500">계정에 로그인해 업무를 시작하세요.</p>
        <form id="login-form" class="mt-8 space-y-5">
          <label class="block text-sm font-medium text-slate-700">이메일<input name="email" type="email" autocomplete="email" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100" /></label>
          <label class="block text-sm font-medium text-slate-700">비밀번호<input name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100" /></label>
          <p id="form-error" class="hidden rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
          <button id="submit-button" type="submit" class="w-full rounded-2xl bg-ink px-5 py-3.5 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800 hover:shadow-md">로그인</button>
        </form>
      </div>
    </div>
  </div>
</section>
<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('form-error');
  const submitButton = document.getElementById('submit-button');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.add('hidden');
    submitButton.disabled = true;
    submitButton.textContent = '확인 중...';
    try {
      const response = await fetch('/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.detail || '로그인에 실패했습니다.');
      document.cookie = `access_token=${encodeURIComponent(payload.access_token)}; Path=/; SameSite=Lax`;
      window.location.href = payload.roles.includes('administrator') || payload.roles.includes('program_manager') || payload.roles.includes('finance') ? '/finance' : '/announcements';
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.remove('hidden');
      submitButton.disabled = false;
      submitButton.textContent = '로그인';
    }
  });
</script>
{% endblock %}
